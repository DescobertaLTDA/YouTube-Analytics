name: Snapshot horário dos canais

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/canais-terceiros/snapshot
        run: |
          curl -sf -X POST "https://analiseyoutube.vercel.app/api/canais-terceiros/snapshot" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -o response.json -w "\nHTTP %{http_code}\n"
          cat response.json
